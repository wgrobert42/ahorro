name: Compilar APK

on:
  push:
    branches: [main, 'ccr-**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 exige Java 21 (no 17).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # El runner ya incluye el SDK de Android; solo aceptamos licencias
      # para que Gradle pueda descargar la plataforma que falte.
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar web y sincronizar con Android
        run: npm run build && npx cap sync android

      - name: Compilar APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ahorro.apk

      - name: Subir como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ahorro-apk
          path: ahorro.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ahorro APK #${{ github.run_number }}
          body: Descarga `ahorro.apk` desde el móvil y ábrelo para instalarlo.
          files: ahorro.apk
          make_latest: true
